# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: "ja-JP"

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
  tools:
    ruff:
      enabled: true  # CIは E9,F6,F7,F63,W6,PLE,T10,B006 のみ強制（既存2210件のlint負債のため全量選択は未適用）
  path_instructions:
    # ──────────────────────────────────────────────────────────────────────────
    # Python: 意味的・設計的観点 + CI未強制な静的パターンの補完
    # ──────────────────────────────────────────────────────────────────────────
    - path: "**/*.py"
      instructions: |
        以下の **意味的・設計的ミスパターン** を優先して確認してください。

        ### [MUST] #1 スコープクリープ（ついで改善の混入）
        バグ修正・Issue 対応 PR に、修正に不要なリファクタ・整理・無関係な変更が混入していないか確認。

        ### [MUST] #3 影響範囲漏れ（兄弟ファイル未修正）
        1 ファイルだけ変更されていて、同じパターンの類似モジュール・スクリプトが未更新でないか確認。

        ### [MUST] #9 例外握りつぶし（設計観点）
        空の `except: pass` / `except Exception: pass` / ログのみで握りつぶしていないか確認。
        Ruff で検出できない意味的な握りつぶし（握って別の値を返す等）も対象です。

        ### [SUGGEST] #10 テスト品質
        - 振る舞い変更にテストが追加されていない場合は [SUGGEST] で指摘
        - アサーションを緩めた・削除してグリーンにしていないか確認
        - 正常系のみで異常系・エッジケースが未テストなら [SUGGEST] で指摘

        ### [SUGGEST] 型ヒント・インポート順序（新規/変更行のみ）
        CIのRuffゲートは重大な正しさのみを強制しており、型ヒント・インポート順序は
        既存負債（2210件）のため未強制です。新規追加・変更した関数の引数と戻り値には
        型ヒントを付けるよう [SUGGEST] で指摘してください（既存の未修正箇所への指摘は不要）。

        ### Python 設計 lean ガードレール（Ruff 非検出の観点）
        - データ構造定義には `dict` より Pydantic モデルを使用し、実行時型バリデーションを行うこと
        - Docstring は Google Style で記述（公開関数・クラスは必須）— Ruff で検出しない「中身の質」を確認

    # ──────────────────────────────────────────────────────────────────────────
    # 教材 Markdown: 教材品質ゲート連携
    # ──────────────────────────────────────────────────────────────────────────
    - path: "material/**/*.md"
      instructions: |
        教材コンテンツの品質を確認してください：

        ### [MUST] 教材品質ゲート
        - コードブロックに言語指定（` ```python ` 等）があるか
        - 写経用コードが意図通りに動作しそうか（明らかな構文エラーがないか）
        - 手順の説明と対応するコードが一致しているか
        - 説明なしにコードだけ貼り付けていないか（学習者が理解できないコンテキスト不足）

        ### [SUGGEST] 学習者体験
        - 難易度の急上昇がないか（前のステップと比べて説明なしに難しくなっていないか）
        - 重要概念に例が付いているか

    # ──────────────────────────────────────────────────────────────────────────
    # PR 全体: 架空完了 + 影響範囲（言語非依存 catch-all）
    # ──────────────────────────────────────────────────────────────────────────
    - path: "**"
      instructions: |
        ### [MUST] #2 架空完了 / 動作未確認の示唆
        PR 説明・コミットメッセージに「動くはず」「確認してください」「動作確認済み（根拠なし）」等の
        記述がある場合は [MUST] で指摘してください。

        ### [Q] #3 影響範囲の PR 説明漏れ
        変更したファイルと同じパターンの類似ファイルが存在するにもかかわらず、
        PR 説明に変更範囲の説明が無い場合は [Q] で確認してください。

chat:
  auto_reply: true
