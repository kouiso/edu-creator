# 依存の更新 PR は月1回（月初・日本時間）だけ。軽い更新（minor・patch）は1本にまとめ、
# dependabot-auto-merge.yml が自動マージの対象にする。大きい更新は手動。
# 公開から3日たっていない版は待つ。同時に開く PR は2本まで（対象は Python の依存だけ。
# 項目を増やすと上限が項目ごとに数えられ、2本を超えるため増やさない）。
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

