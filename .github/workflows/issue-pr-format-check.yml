name: Issue and PR format check

# issue は 背景 / 今どこまで / 次にやること / 誰の判断待ち / 完了条件、
# PR は 概要 / 変更内容 / 関連Issue がそろっているかを文字の規則だけで見る（AI は使わない）。
# 足りない時は目印つきのコメントを1つだけ作り、直ったら同じコメントを OK に更新する。
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

# 同じ issue / PR の検査が重なったら古い方を止める（コメントの二重投稿を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check headings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: python3 -m repobot form
