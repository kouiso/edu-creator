[project]
name = "edu-creator"
version = "3.0.0.dev0"
description = "AI-powered educational material generator using CrewAI (GPT + Gemini Flash)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "kouiso", email = "kouiso@example.com" }
]
keywords = ["ai", "education", "crewai", "tutorial", "generator"]

dependencies = [
    "crewai[google-genai]>=0.28.0",
    "crewai-tools>=0.4.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "litellm>=1.75.3",
    "pydantic>=2.0.0",
    "pymupdf>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
edu-creator = "educreator.cli:main"
edu-creator-legacy = "main:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 手元の editable インストールでは、リポジトリ直下をそのまま import の起点にする。
dev-mode-dirs = ["."]
# wheel に入れるものを名前で列挙する。only-include はグロブを解釈せず、
# グロブで書くと何にも一致せず wheel にコードが1本も入らんかった（edu-creator も edu-creator-legacy も ModuleNotFoundError）
packages = ["educreator", "agents", "config", "core", "prompt", "schemas", "skills", "templates", "tools", "utils"]
# edu-creator-legacy（main:main）が import する直下のモジュール
# packages は直下の .py を拾わんので force-include で名前を渡す
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config_models.py" = "config_models.py"
"pdf_validator.py" = "pdf_validator.py"
"screenshot_manager.py" = "screenshot_manager.py"
"quality_checker.py" = "quality_checker.py"

# =============================================================================
# Ruff Configuration (Linter + Formatter)
# =============================================================================
[tool.ruff]
# Target Python version
target-version = "py311"

# Line length
line-length = 100

# Exclude patterns
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["edu_creator"]

[tool.ruff.format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
