name: PR triage

# PR を開いた（開き直した）人を担当者にし、ブランチ名と変更したファイルの場所でラベルを足す。
# ボットの PR には担当者を付けない。担当者付けに失敗してもラベル付けは続ける。既にあるラベルは消さない。
on:
  pull_request_target:
    # push のたびには動かさない（人が外したラベルを付け直さないため）
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign and label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        # repobot はこのワークフローと同時期に入る。既定ブランチに無い間は何もせず終わる。
        run: |
          if [ ! -f scripts/repobot/__main__.py ]; then
            echo "::notice::repobot is not on the default branch yet; skipping triage"
            exit 0
          fi
          python3 -m repobot triage
